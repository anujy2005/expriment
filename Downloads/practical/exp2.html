<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .conatiner{
            display: flex;
            padding: 10px;
            gap: 20px;
            width: 800px;
            height: 400px;
            border: 1px solid black;
        }
        .box{
            background-color: aqua;
            padding: 12px;
            width: 65px;
            height: 50px;
            justify-content: center;
            text-align: center;
            border: 2px solid;
        }
        @media( max-width: 600px){
            .conatiner{
              flex-direction: column; 
            }
        }
    </style>
</head>
<body>
    <div class="conatiner">
        <div class="box">Box</div>
        <div class="box">Box</div>
        <div class="box">Box</div>
        <div class="box">Box</div>
        <div class="box">Box</div>
    </div>
</body>
</html>
